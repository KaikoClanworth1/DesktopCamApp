name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0) — no release is published'
        required: false
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # CMakeLists.txt is the single source of truth for the version. If the
      # tag disagrees with it the build would ship a binary that reports the
      # wrong version and offers itself an endless update, so fail loudly.
      - name: Check tag matches DCA_VERSION
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern '^\s*set\(DCA_VERSION\s+"([^"]+)"\)' |
                  Select-Object -First 1
          if (-not $line) { throw "Could not find set(DCA_VERSION ...) in CMakeLists.txt" }
          $src = $line.Matches[0].Groups[1].Value
          "version=$src" >> $env:GITHUB_OUTPUT

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            if ($tag -ne $src) {
              throw "Tag v$tag does not match DCA_VERSION $src in CMakeLists.txt. " +
                    "Bump DCA_VERSION and re-tag."
            }
          }
          Write-Host "Building version $src"

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DDCA_GITHUB_OWNER=${{ github.repository_owner }}
          -DDCA_GITHUB_REPO=${{ github.event.repository.name }}

      - name: Build
        run: cmake --build build --config Release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/DesktopCamApp.exe dist/DesktopCamApp.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/DesktopCamApp.exe, dist/README.md `
                           -DestinationPath dist/DesktopCamApp-${{ steps.ver.outputs.version }}.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCamApp-${{ steps.ver.outputs.version }}
          path: dist/DesktopCamApp.exe

      # The in-app updater looks for an asset literally named
      # DesktopCamApp.exe — keep that name on every release.
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopCamApp ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/DesktopCamApp.exe
            dist/DesktopCamApp-${{ steps.ver.outputs.version }}.zip
